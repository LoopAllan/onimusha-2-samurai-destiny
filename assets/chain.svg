<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 180"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">首飾交換關聯示意</title>
  <desc id="desc">
    白墨、平家物語、徽章、哈密瓜、交付男子、回訪父親。原創示意，不是地圖。
  </desc>
  <rect width="900" height="180" fill="#1d2420" />
  <g fill="none" stroke="#e6c58d" stroke-width="2">
    <path d="M90 65H810" />
    <path d="m230 60 8 5-8 5m150-10 8 5-8 5m150-10 8 5-8 5m150-10 8 5-8 5" />
  </g>
  <g fill="#1d2420" stroke="#e6c58d" stroke-width="2">
    <circle cx="75" cy="65" r="29" />
    <circle cx="225" cy="65" r="29" />
    <circle cx="375" cy="65" r="29" />
    <circle cx="525" cy="65" r="29" />
    <circle cx="675" cy="65" r="29" />
    <circle cx="825" cy="65" r="29" />
  </g>
  <g
    fill="#f0eee3"
    font-family="sans-serif"
    font-size="20"
    text-anchor="middle"
