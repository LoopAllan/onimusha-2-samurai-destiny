    <text x="75" y="72">1</text>
    <text x="225" y="72">2</text>
    <text x="375" y="72">3</text>
    <text x="525" y="72">4</text>
    <text x="675" y="72">5</text>
    <text x="825" y="72">6</text>
    <text x="75" y="125">白墨</text>
    <text x="225" y="125">平家物語</text>
    <text x="375" y="125">徽章</text>
    <text x="525" y="125">哈密瓜</text>
    <text x="675" y="125">交付男子</text>
    <text x="825" y="125">回訪父親</text>
  </g>
</svg>
